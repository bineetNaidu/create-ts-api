services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_local
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=create_ts_api_gql_psql_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
